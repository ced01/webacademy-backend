spring:
  application:
    name: webskills-academy-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/webskills_academy}
    username: ${DB_USERNAME:webskills}
    password: ${DB_PASSWORD:webskills_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yml
app:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    expiration: ${JWT_EXPIRATION:86400000}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  swagger:
    enabled: ${ENABLE_SWAGGER:false}
  admin:
    email: ${ADMIN_DEFAULT_EMAIL:admin@webskills.local}
    password: ${ADMIN_DEFAULT_PASSWORD:ChangeMe123!}
logging:
  level:
    fr.webskills.academy: INFO
