Cette section explique syntaxe et types dans le domaine Java avec une progression courte, pratique et vérifiable. Elle reformule les concepts essentiels sans recopier la documentation.

## Exemple simple
Commence par un exemple minimal, observe le résultat, puis ajoute une seule notion à la fois. Garde des noms explicites et vérifie le comportement attendu avant de complexifier.

## Bonnes pratiques
