databaseChangeLog:
  - changeSet:
      id: 005-frontend-audit-complete-learning-content
      author: hermes
      changes:
        - sql:
            splitStatements: false
            sql: |
              UPDATE learning_sections s
              SET content = '# ' || s.title || CHR(10) || CHR(10) ||
              '## Synthèse pédagogique' || CHR(10) ||
              COALESCE(s.summary, s.description, 'Section pédagogique progressive.') || ' Cette synthèse originale résume les notions clés, sans copier la documentation.' || CHR(10) || CHR(10) ||
              '## Exemple simple' || CHR(10) ||
              'Créer un exemple minimal, vérifier le résultat, puis ajouter une seule notion à la fois.' || CHR(10) || CHR(10) ||
              '## Bonnes pratiques' || CHR(10) ||
              '- Utiliser des noms explicites.' || CHR(10) || '- Tester un cas simple et un cas limite.' || CHR(10) || '- Garder un lien vers la source officielle.' || CHR(10) || CHR(10) ||
              '## Erreurs fréquentes' || CHR(10) ||
              '- Copier sans comprendre.' || CHR(10) || '- Mélanger trop de notions dans un exercice.' || CHR(10) || CHR(10) ||
              '## Liens utiles' || CHR(10) || '- ' || COALESCE(s.source_name, 'Documentation officielle') || ': ' || COALESCE(s.source_url, 'https://developer.mozilla.org/fr/'),
              source_name = CASE d.slug
                WHEN 'html' THEN 'MDN HTML / WHATWG HTML'
                WHEN 'css' THEN 'MDN CSS / W3C CSS'
                WHEN 'javascript' THEN 'MDN JavaScript / ECMAScript'
                WHEN 'php' THEN 'php.net'
                WHEN 'sql' THEN 'PostgreSQL / MySQL'
                WHEN 'figma-wireframes' THEN 'Figma Help Center'
                ELSE COALESCE(s.source_name, 'Documentation officielle') END,
              source_url = CASE d.slug
                WHEN 'html' THEN 'https://developer.mozilla.org/fr/docs/Web/HTML'
                WHEN 'css' THEN 'https://developer.mozilla.org/fr/docs/Web/CSS'
                WHEN 'javascript' THEN 'https://developer.mozilla.org/fr/docs/Web/JavaScript'
                WHEN 'php' THEN 'https://www.php.net/manual/fr/'
                WHEN 'sql' THEN 'https://www.postgresql.org/docs/'
                WHEN 'figma-wireframes' THEN 'https://help.figma.com/'
                ELSE s.source_url END,
              source_verified_at = '2026-07-19T00:00:00'
              FROM learning_domains d
              WHERE s.domain_id = d.id;
