databaseChangeLog:
  - changeSet:
      id: 006-remove-progress-and-enrich-courses
      author: hermes
      changes:
        - dropTable:
            tableName: learner_progress
            cascadeConstraints: true
        - sql:
            splitStatements: false
            sql: |
              UPDATE learning_sections s
              SET content = '# ' || s.title || CHR(10) || CHR(10) ||
                '## Objectifs pédagogiques' || CHR(10) ||
                '- Comprendre la notion principale de cette section.' || CHR(10) ||
                '- Savoir l appliquer dans un exemple court.' || CHR(10) ||
                '- Identifier une bonne pratique, une erreur fréquente et une vérification.' || CHR(10) || CHR(10) ||
                '## Prérequis' || CHR(10) ||
                CASE s.level WHEN 'BEGINNER' THEN 'Aucun prérequis avancé : connaître le vocabulaire de base du domaine suffit.' WHEN 'INTERMEDIATE' THEN 'Avoir déjà pratiqué les bases et savoir lire un exemple de code.' ELSE 'Comprendre les bases du domaine et les contraintes d un projet web maintenable.' END || CHR(10) || CHR(10) ||
                '## Introduction' || CHR(10) ||
                COALESCE(s.summary, s.description, 'Cette section présente une notion technique utile dans un projet web.') || ' Le cours est reformulé pour apprendre par objectifs, exemples et vérifications.' || CHR(10) || CHR(10) ||
                '## Concepts essentiels' || CHR(10) ||
                'Commencez par isoler le besoin réel, puis reliez la syntaxe au comportement attendu. Une bonne solution reste lisible, testable et adaptée au niveau de difficulté.' || CHR(10) || CHR(10) ||
                '## Exemple simple' || CHR(10) ||
                '```text' || CHR(10) || '1. Créer un cas minimal' || CHR(10) || '2. Observer le résultat' || CHR(10) || '3. Ajouter une seule variation' || CHR(10) || '4. Vérifier le cas limite' || CHR(10) || '```' || CHR(10) || CHR(10) ||
                '## Bonnes pratiques' || CHR(10) ||
                '- Utiliser des noms explicites et cohérents.' || CHR(10) || '- Tester le cas nominal et un cas limite.' || CHR(10) || '- Garder la documentation officielle comme référence de syntaxe.' || CHR(10) || CHR(10) ||
                '## Erreurs fréquentes' || CHR(10) ||
                '- Copier un exemple sans comprendre son contexte.' || CHR(10) || '- Mélanger plusieurs notions dans le même exercice.' || CHR(10) || '- Oublier la validation, l accessibilité ou la sécurité lorsque l interface manipule des données.' || CHR(10) || CHR(10) ||
                '## Accessibilité' || CHR(10) || 'Lorsque le sujet touche une interface, vérifiez la navigation clavier, les libellés et la hiérarchie des titres.' || CHR(10) || CHR(10) ||
                '## Sécurité' || CHR(10) || 'Validez les entrées, échappez les sorties et évitez d exposer des informations internes.' || CHR(10) || CHR(10) ||
                '## Exercice' || CHR(10) || 'Construisez un exemple minimal lié au sujet, puis ajoutez une assertion, une vérification clavier ou une validation de données.' || CHR(10) || CHR(10) ||
                '## Correction' || CHR(10) || 'La correction doit être lisible, sans duplication inutile, et vérifiable par un test ou une inspection reproductible.' || CHR(10) || CHR(10) ||
                '## Résumé' || CHR(10) || 'Une section utile explique le pourquoi, montre le comment et donne une méthode de vérification.' || CHR(10) || CHR(10) ||
                '## Sources officielles' || CHR(10) || '- [' || COALESCE(s.source_name, 'Documentation officielle') || '](' || COALESCE(s.source_url, 'https://developer.mozilla.org/fr/') || ')',
                updated_at = '2026-07-20T00:00:00'
              WHERE s.content IS NULL OR s.content LIKE '%Section exemple%' OR s.content LIKE '%synthèse originale résume%' OR s.content LIKE '%Créer un exemple minimal%';
        - insert:
            tableName: learning_sections
            columns:
              - column: {name: id, value: '71f95c44-c229-5470-ab36-efd5f3c98466'}
              - column: {name: domain_id, valueComputed: "(SELECT id FROM learning_domains WHERE slug = 'html')"}
              - column: {name: title, value: 'Rôle de <!doctype html>'}
              - column: {name: slug, value: 'doctype-html'}
              - column: {name: summary, value: 'Déclarer le mode standard du navigateur.'}
              - column:
                  name: content
                  value: |-
                    # Rôle de <!doctype html>
                    
                    ## Objectifs pédagogiques
                    - Comprendre le rôle de rôle de <!doctype html> dans le domaine html.
                    - Savoir l'utiliser dans un petit projet web.
                    - Identifier les erreurs fréquentes et les corriger.
                    
                    ## Prérequis
                    Niveau Débutant. Il faut connaître les notions des niveaux précédents et savoir lire un exemple de code court.
                    
                    ## Introduction
                    Le doctype indique au navigateur qu’il doit utiliser le mode standard moderne au lieu de comportements historiques.
                    
                    ## Concepts essentiels
                    La notion doit être reliée à un besoin utilisateur, à une structure de données claire et à un comportement observable. Commencez par nommer précisément les éléments, puis validez le résultat avec un exemple minimal.
                    
                    ## Syntaxe
                    ```html
                    <!doctype html>
                    <html lang="fr">
                      <head><meta charset="utf-8"><title>Page</title></head>
                      <body><h1>Bonjour</h1></body>
                    </html>
                    ```
                    
                    ## Exemple simple
                    Créez un exemple minimal, exécutez-le, puis ajoutez une seule variation. Cette méthode rend les erreurs plus faciles à isoler.
                    
                    ## Explication de l'exemple
                    Chaque ligne a un rôle explicite : définir la structure, fournir une information utile, puis rendre le comportement vérifiable par lecture ou par test.
                    
                    ## Exemple concret
                    Dans une plateforme de cours, cette notion sert à afficher un contenu fiable, maintenable et compréhensible par plusieurs développeurs.
                    
                    ## Bonnes pratiques
                    - Donner des noms explicites aux fichiers, variables, composants ou balises.
                    - Valider le résultat avec un cas nominal et un cas limite.
                    - Séparer la structure, le comportement et la présentation lorsque c'est possible.
                    - Documenter les choix qui peuvent surprendre un autre développeur.
                    
                    ## Erreurs fréquentes
                    - Copier un exemple sans comprendre ses prérequis.
                    - Mélanger plusieurs objectifs dans la même modification.
                    - Tester uniquement le cas qui fonctionne déjà.
                    
                    ## Accessibilité
                    Ajoutez `lang="fr"` sur `html` pour aider les lecteurs d’écran à choisir la bonne prononciation.
                    
                    ## Sécurité
                    Ne jamais faire confiance aux données externes : validez les entrées, échappez les sorties et appliquez le principe du moindre privilège.
                    
                    ## Exercice
                    Créez une mini-page ou une mini-fonction qui utilise rôle de <!doctype html>, puis ajoutez un cas de test ou une vérification manuelle reproductible.
                    
                    ## Correction
                    Comparez votre solution avec les critères suivants : structure claire, nommage explicite, comportement vérifiable, absence de duplication inutile et lien avec la documentation officielle.
                    
                    ## Résumé
                    Rôle de <!doctype html> devient utile lorsque la notion est comprise, appliquée dans un exemple court, puis vérifiée dans un cas proche d'un vrai projet.
                    
                    ## Sources officielles
                    - [MDN HTML / WHATWG HTML](https://developer.mozilla.org/fr/docs/Web/HTML)
