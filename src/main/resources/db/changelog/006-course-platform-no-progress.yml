                  value: |-
                    # Déploiement — Architecture, performance et sécurité
                    
                    ## Objectifs pédagogiques
                    - Comprendre le rôle de déploiement — architecture, performance et sécurité dans le domaine deploiement.
                    - Savoir l'utiliser dans un petit projet web.
                    - Identifier les erreurs fréquentes et les corriger.
                    
                    ## Prérequis
                    Niveau Avancé. Il faut connaître les notions des niveaux précédents et savoir lire un exemple de code court.
                    
                    ## Introduction
                    Cette section transforme la notion déploiement — architecture, performance et sécurité en compétence pratique. Elle explique quand l’utiliser, pourquoi elle existe et comment la vérifier dans une application réelle.
                    
                    ## Concepts essentiels
                    La notion doit être reliée à un besoin utilisateur, à une structure de données claire et à un comportement observable. Commencez par nommer précisément les éléments, puis validez le résultat avec un exemple minimal.
                    
                    ## Syntaxe
                    ```text
                    <main>
                      <h1>Exemple</h1>
                      <p>Contenu structuré.</p>
                    </main>
                    ```
                    
                    ## Exemple simple
                    Créez un exemple minimal, exécutez-le, puis ajoutez une seule variation. Cette méthode rend les erreurs plus faciles à isoler.
                    
                    ## Explication de l'exemple
                    Chaque ligne a un rôle explicite : définir la structure, fournir une information utile, puis rendre le comportement vérifiable par lecture ou par test.
                    
                    ## Exemple concret
                    Dans une plateforme de cours, cette notion sert à afficher un contenu fiable, maintenable et compréhensible par plusieurs développeurs.
                    
                    ## Bonnes pratiques
                    - Donner des noms explicites aux fichiers, variables, composants ou balises.
                    - Valider le résultat avec un cas nominal et un cas limite.
                    - Séparer la structure, le comportement et la présentation lorsque c'est possible.
                    - Documenter les choix qui peuvent surprendre un autre développeur.
                    
                    ## Erreurs fréquentes
                    - Copier un exemple sans comprendre ses prérequis.
                    - Mélanger plusieurs objectifs dans la même modification.
                    - Tester uniquement le cas qui fonctionne déjà.
                    
                    ## Accessibilité
                    Préserver la navigation clavier, les intitulés compréhensibles et une hiérarchie de titres logique lorsque la notion touche l’interface.
                    
                    ## Sécurité
                    Ne jamais faire confiance aux données externes : validez les entrées, échappez les sorties et appliquez le principe du moindre privilège.
                    
                    ## Exercice
                    Créez une mini-page ou une mini-fonction qui utilise déploiement — architecture, performance et sécurité, puis ajoutez un cas de test ou une vérification manuelle reproductible.
                    
                    ## Correction
                    Comparez votre solution avec les critères suivants : structure claire, nommage explicite, comportement vérifiable, absence de duplication inutile et lien avec la documentation officielle.
                    
                    ## Résumé
                    Déploiement — Architecture, performance et sécurité devient utile lorsque la notion est comprise, appliquée dans un exemple court, puis vérifiée dans un cas proche d'un vrai projet.
                    
                    ## Sources officielles
                    - [Docker Documentation](https://docs.docker.com/)
