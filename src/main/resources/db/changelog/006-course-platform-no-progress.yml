              - column: {name: slug, value: 'contenu-interactif-semantique'}
              - column: {name: summary, value: 'Utiliser boutons et liens selon l action réelle.'}
              - column:
                  name: content
                  value: |-
                    # Contenu interactif sémantique

                    ## Objectifs pédagogiques
                    - Choisir entre un lien et un bouton selon l'intention utilisateur.
                    - Préserver un nom accessible et un focus visible.
                    - Relier HTML natif, clavier et technologies d'assistance.

                    ## Prérequis
                    Connaître les liens, formulaires et landmarks HTML.

                    ## Introduction
                    Un lien navigue vers une ressource; un bouton déclenche une action. Cette différence aide les navigateurs, le clavier et les lecteurs d'écran à annoncer le bon comportement.

                    ## Syntaxe
                    ```html
                    <a href="/cours/html">Voir le cours HTML</a>
                    <button type="button">Ouvrir le menu</button>
                    ```

                    ## Bonnes pratiques
                    - Ne pas utiliser un lien vide avec JavaScript pour simuler un bouton.
                    - Garder un texte compréhensible hors contexte.
                    - Vérifier l'ordre de tabulation au clavier.

                    ## Erreurs fréquentes
                    - Remplacer un bouton natif par un `div` cliquable sans gestion clavier.
                    - Retirer le style de focus sans alternative visible.

                    ## Accessibilité
                    Le HTML natif fournit déjà rôle, clavier et états de base. N'ajoutez ARIA que pour compléter un comportement réellement implémenté.

                    ## Exercice
                    Transformez deux `div` cliquables en éléments natifs adaptés, puis vérifiez la navigation avec Tab et Entrée.

                    ## Correction
                    La navigation doit utiliser `a href`; l'action locale doit utiliser `button type="button"` avec un libellé visible.

                    ## Sources officielles
                    - [MDN HTML](https://developer.mozilla.org/fr/docs/Web/HTML)
                    - [WAI ARIA Authoring Practices](https://www.w3.org/WAI/ARIA/apg/)
