                    ## Introduction
                    Cette section transforme la notion audit wcag et rgaa en compétence pratique. Elle explique quand l’utiliser, pourquoi elle existe et comment la vérifier dans une application réelle.
                    
                    ## Concepts essentiels
                    Les outils automatiques repèrent une partie des problèmes; la navigation clavier, la pertinence des libellés et l’ordre de lecture restent à vérifier humainement.
                    
                    ## Syntaxe
                    ```html
                    # Exemples d’outils
                    # Lighthouse, axe DevTools, validateur HTML, revue clavier manuelle
                    ```
                    
                    ## Exemple simple
                    Créez un exemple minimal, exécutez-le, puis ajoutez une seule variation. Cette méthode rend les erreurs plus faciles à isoler.
                    
                    ## Explication de l'exemple
                    Chaque ligne a un rôle explicite : définir la structure, fournir une information utile, puis rendre le comportement vérifiable par lecture ou par test.
                    
                    ## Exemple concret
                    Dans une plateforme de cours, cette notion sert à afficher un contenu fiable, maintenable et compréhensible par plusieurs développeurs.
                    
                    ## Bonnes pratiques
