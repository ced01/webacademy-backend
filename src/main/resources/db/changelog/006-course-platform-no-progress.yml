                    # Audit WCAG et RGAA
                    
                    ## Objectifs pédagogiques
                    - Comprendre le rôle de audit wcag et rgaa dans le domaine html.
                    - Savoir l'utiliser dans un petit projet web.
                    - Identifier les erreurs fréquentes et les corriger.
                    
                    ## Prérequis
